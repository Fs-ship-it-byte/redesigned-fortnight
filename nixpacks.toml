# Puppeteer necesita estas librerías del sistema para poder correr Chromium
# headless en el contenedor de Railway (sin esto, "puppeteer.launch()"
# falla con errores de librerías compartidas faltantes, tipo
# "error while loading shared libraries: libnss3.so").
[phases.setup]
aptPkgs = [
  "libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libdrm2",
  "libxkbcommon0", "libxcomposite1", "libxdamage1", "libxfixes3",
  "libxrandr2", "libgbm1", "libasound2", "libpangocairo-1.0-0",
  "libpango-1.0-0", "libcairo2", "libatspi2.0-0"
]
